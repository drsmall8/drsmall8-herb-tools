<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小巴中醫 - 頂級實證科學中藥換算平台</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; align-items: flex-start;}
        .column { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; }
        .left-col { flex: 1.2; }
        .right-col { flex: 0.8; background-color: #fafbfc; position: sticky; top: 20px;}
        input, select, button { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;}
        .search-bar input { flex: 1; min-width: 200px;}
        .search-bar select { flex: 0.5; min-width: 120px;}
        
        /* 藥廠過濾器樣式 */
        .brand-filters-container { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 10px; margin-bottom: 15px; }
        .brand-filters-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
        .brand-filters { display: flex; flex-wrap: wrap; gap: 10px; max-height: 120px; overflow-y: auto; font-size: 14px;}
        .brand-filters label { display: flex; align-items: center; cursor: pointer; background: #fff; padding: 4px 8px; border-radius: 20px; border: 1px solid #ddd; }
        .brand-filters label:hover { background: #eef2f5; }
        .brand-count { color: #888; font-size: 12px; margin-left: 4px; }
        .btn-small { padding: 2px 8px; font-size: 12px; cursor: pointer; background: #6c757d; color: white; border: none; border-radius: 3px;}
        .btn-small:hover { background: #5a6268; }

        /* 列表樣式 */
        .drug-list, .prescription-list, .result-list { list-style: none; padding: 0; margin: 0; }
        .drug-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; position: relative; }
        .drug-item:hover { background-color: #f9f9f9; }
        
        /* 滑鼠懸停資訊卡 (Tooltip) */
        .drug-info-wrapper { flex: 1; cursor: help; }
        .hover-card {
            display: none; position: absolute; left: 0; top: 100%; width: 95%; z-index: 10;
            background: #fff; border: 1px solid #2c3e50; border-radius: 6px; padding: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); font-size: 13px; line-height: 1.6; color: #333;
        }
        .drug-info-wrapper:hover .hover-card { display: block; }
        .hover-card-title { font-weight: bold; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 6px; }
        .hover-card p { margin: 3px 0; }

        /* 按鈕與處方區塊 */
        .add-btn { background-color: #4CAF50; color: white; border: none; cursor: pointer; padding: 5px 15px; border-radius:4px;}
        .add-btn:hover { background-color: #45a049; }
        .remove-btn { background-color: #f44336; color: white; border: none; cursor: pointer; padding: 5px 10px; border-radius:4px;}
        .presc-item { background: #e8f4f8; padding: 10px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 數字輸入框優化 (隱藏箭頭、極端劑量警示) */
        .presc-item input { width: 70px; text-align: center; font-size: 16px; font-weight: bold; color: #2c3e50; transition: 0.3s;}
        .presc-item input.high-dose { background-color: #ffe0b2; border: 2px solid #f57c00; color: #d84315; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* 右側結果區塊 */
        .result-item { padding: 8px 0; border-bottom: 1px dashed #ccc; display: flex; justify-content: space-between; font-weight: bold;}
        .toxic-alert { color: #d32f2f; font-size: 12px; display: block; margin-top: 3px;} 
        .total-weight { font-size: 18px; color: #d32f2f; margin-top: 15px; text-align: right; font-weight: bold;}
        
        /* 系統提示與警告狀態 */
        #statusMessage { background: #fff3cd; color: #856404; padding: 10px; text-align: center; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        .warning-text { color: #d32f2f !important; font-weight: bold; }
        .warning-bg { background-color: #ffebee !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>科學中藥原藥材換算平台</h1>
        <p>支援部分拔提精準計算、同物異名合併、與極端劑量防呆把關</p>
    </div>

    <div id="statusMessage">正在從 Google 雲端載入最新中藥資料庫，請稍候...</div>

    <div class="container">
        <div class="column left-col">
            <h3>🔍 搜尋與開立處方</h3>
            
            <div class="brand-filters-container">
                <div class="brand-filters-header">
                    <span>🏢 廠牌篩選 (勾選您診所進貨的藥廠)</span>
                    <div>
                        <button class="btn-small" onclick="selectAllBrands(true)">全選</button>
                        <button class="btn-small" onclick="selectAllBrands(false)">全不選</button>
                    </div>
                </div>
                <div class="brand-filters" id="brandCheckboxes">
                    </div>
            </div>

            <div class="search-bar">
                <select id="categorySelect" onchange="filterDrugs()">
                    <option value="all">所有劑型</option>
                    <option value="濃縮散劑">濃縮散劑</option>
                    <option value="濃縮顆粒劑">濃縮顆粒劑</option>
                    <option value="濃縮細粒劑">濃縮細粒劑</option>
                    <option value="濃縮錠劑">濃縮錠劑</option>
                    <option value="濃縮膠囊劑">濃縮膠囊劑</option>
                    <option value="散劑">散劑</option>
                    <option value="錠劑">錠劑</option>
                    <option value="膠囊劑">膠囊劑</option>
                    <option value="丸劑">丸劑</option>
                </select>
                <input type="text" id="searchInput" placeholder="輸入藥名、注音簡稱或許可證字號搜尋..." onkeyup="filterDrugs()">
            </div>
            
            <div style="max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; margin-bottom: 20px;">
                <ul class="drug-list" id="drugList">
                    </ul>
            </div>

            <h3>📝 目前處方 (點擊輸入一日克數)</h3>
            <div id="prescriptionList">
                </div>
        </div>

        <div class="column right-col">
            <h3>📊 原藥材換算結果</h3>
            <p style="font-size: 13px; color: #666;">系統自動合併同類藥材。遇毒劇藥超量將顯示紅字警示。</p>
            <ul class="result-list" id="resultList">
                </ul>
            <div class="total-weight" id="totalWeightDisplay" style="border-top: 2px solid #333; padding-top:10px;">
                總生藥重量: 0.00 g
            </div>
            <div class="total-weight" id="totalExcipientDisplay" style="color: #795548; font-size: 16px;">
                總賦形劑量: 0.00 g
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 第 132 行：請在下方引號內，貼上您的 Google 試算表 CSV 網址
        // ==========================================
        const googleSheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT5wPHCM9ybm9133NpX9HgFee9chFqvpvr9J2yQG8NVpzVBVeZvkOkkXI6vgva32xs8C_c2SbI5lObD/pub?output=csv";

        let database = []; 
        let prescription = []; 

        // 🌟【同物異名正規化字典】可隨時依臨床習慣擴充
        const herbDictionary = {
            "甘草(炙)": "炙甘草", "甘草（炙）": "炙甘草", "蜜甘草": "炙甘草", "炙草": "炙甘草",
            "薑": "生薑", "乾薑": "乾薑", "薑(炮)": "炮薑", "炮薑": "炮薑",
            "桂枝(去皮)": "桂枝", "牛膝": "懷牛膝", "川牛膝": "懷牛膝",
            "半夏(薑製)": "薑半夏", "半夏": "薑半夏", "製半夏": "薑半夏",
            "大黃(酒製)": "大黃", "大黃(酒炒)": "大黃"
        };
        
        // 🌟【毒劇藥與安全極限警示】(單位:克，每日安全上限參考)
        const toxicAlerts = { "麻黃": 10, "附子": 15, "細辛": 3, "生南星": 3, "大黃": 15 };

        function normalizeHerbName(name) {
            const cleanName = name.trim();
            return herbDictionary[cleanName] || cleanName;
        }

        // 解析藥材字串為物件與總重量
        function parseHerbString(str) {
            let obj = {};
            let total = 0;
            if (str) {
                str.split('|').forEach(pair => {
                    const kv = pair.split(':');
                    if (kv.length === 2) {
                        const name = normalizeHerbName(kv[0]);
                        const w = parseFloat(kv[1]) || 0;
                        obj[name] = (obj[name] || 0) + w;
                        total += w;
                    }
                });
            }
            return { obj, total, displayStr: str.replace(/\|/g, ', ') || '無' };
        }

        function loadCloudDatabase() {
            const statusMessage = document.getElementById('statusMessage');
            Papa.parse(googleSheetCsvUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    let brandCounts = {}; 
                    database = [];
                    results.data.forEach((row, index) => {
                        if (!row['顯示名稱']) return;
                        const brand = row['藥廠'] || '未知藥廠';
                        const ratio = parseFloat(row['濃縮倍數']) || 0;
                        
                        if(brand !== '其他藥廠' && brand !== '未知藥廠') {
                            brandCounts[brand] = (brandCounts[brand] || 0) + 1;
                        }
                        
                        // 解析三組成分
                        const conc = parseHerbString(row['濃縮生藥組成']);
                        const raw = parseHerbString(row['原粉生藥組成']);
                        const exc = parseHerbString(row['賦形劑組成']);
                        
                        database.push({
                            id: index,
                            license: row['許可證字號'] || '', 
                            brand: brand, 
                            name: row['顯示名稱'] || '',
                            category: row['分類標籤'] || '', 
                            ratio: ratio,
                            status: row['解析狀態'] || '', 
                            hint: row['人工校正提示'] || '',
                            isWarning: (row['解析狀態'] || '').includes('⚠️'),
                            
                            concHerbs: conc.obj, concTotalWeight: conc.total, concDisplay: conc.displayStr,
                            rawHerbs: raw.obj, rawTotalWeight: raw.total, rawDisplay: raw.displayStr,
                            excObj: exc.obj, excTotalWeight: exc.total, excDisplay: exc.displayStr,
                            
                            bopomofo: row['注音簡稱'] || '' 
                        });
                    });
                    
                    populateBrandCheckboxes(brandCounts);
                    statusMessage.style.backgroundColor = "#d4edda"; 
                    statusMessage.style.color = "#155724";
                    statusMessage.innerHTML = `✅ 成功連線！載入 <strong>${database.length}</strong> 筆精準純化資料。`;
                    renderDrugs(database);
                },
                error: function(e) { 
                    statusMessage.style.backgroundColor = "#f8d7da"; 
                    statusMessage.style.color = "#721c24";
                    statusMessage.innerHTML = "❌ 載入失敗。請檢查網址是否正確。"; 
                }
            });
        }

        function populateBrandCheckboxes(counts) {
            const container = document.getElementById('brandCheckboxes');
            Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(b => {
                container.innerHTML += `<label><input type="checkbox" value="${b}" class="brand-cb" onchange="filterDrugs()" checked> ${b} <span class="brand-count">(${counts[b]})</span></label>`;
            });
        }

        function selectAllBrands(isSel) {
            document.querySelectorAll('.brand-cb').forEach(cb => cb.checked = isSel); 
            filterDrugs();
        }

        function renderDrugs(drugs) {
            const list = document.getElementById('drugList'); 
            list.innerHTML = '';
            
            drugs.slice(0, 100).forEach(d => {
                const warnTag = d.isWarning ? `<br><small style="color:#d32f2f;">⚠️ 需校正: ${d.hint}</small>` : '';
                const hover = `
                    <div class="hover-card">
                        <div class="hover-card-title">🔍 楚河漢界解析詳情</div>
                        <p><strong>許可證：</strong>${d.license}</p>
                        <p><strong>濃縮倍數：</strong><span style="color:#e67e22; font-weight:bold;">${d.ratio > 0 ? d.ratio : '⚠️ 缺資料'}</span></p>
                        <p><strong>濃縮生藥：</strong><span style="color:#27ae60;">${d.concDisplay}</span></p>
                        <p><strong>原粉生藥：</strong><span style="color:#8e44ad;">${d.rawDisplay}</span></p>
                        <p><strong>賦形劑：</strong><span style="color:#7f8c8d;">${d.excDisplay}</span></p>
                    </div>`;
                list.innerHTML += `
                    <li class="drug-item ${d.isWarning ? 'warning-bg' : ''}">
                        <div class="drug-info-wrapper">
                            <span style="color:#888;font-size:12px;">[${d.brand}] [${d.category}]</span><br>
                            <span class="${d.isWarning?'warning-text':''}" style="font-size:16px;"><strong>${d.name}</strong></span>
                            ${warnTag}
                            ${hover}
                        </div>
                        <button class="add-btn" onclick="addToPrescription(${d.id})">加入</button>
                    </li>`;
            });
            if (drugs.length > 100) {
                list.innerHTML += `<li class="drug-item" style="color:#888; justify-content:center;">...還有 ${drugs.length - 100} 筆，請縮小搜尋範圍...</li>`;
            }
        }

        function filterDrugs() {
            const kw = document.getElementById('searchInput').value.trim().toLowerCase();
            const cat = document.getElementById('categorySelect').value;
            const checked = Array.from(document.querySelectorAll('.brand-cb:checked')).map(cb => cb.value);
            
            renderDrugs(database.filter(d => 
                (cat === 'all' || d.category === cat) && 
                checked.includes(d.brand) && 
                (d.name.toLowerCase().includes(kw) || d.license.toLowerCase().includes(kw) || d.bopomofo.toLowerCase().includes(kw))
            ));
        }

        function addToPrescription(id) {
            if (!prescription.find(p => p.id === id)) { 
                prescription.push({ ...database.find(d => d.id === id), dose: 0 }); 
                renderPrescription(); 
            }
        }

        function removePrescription(id) {
            prescription = prescription.filter(p => p.id !== id); 
            renderPrescription(); 
            calculateResult();
        }

        // 修改劑量時，不重新渲染整個處方列表，避免輸入框失去焦點
        function updateDose(id, value) {
            const p = prescription.find(p => p.id === id);
            if (p) { 
                p.dose = parseFloat(value) || 0; 
                // 極端劑量視覺防呆
                const inputEl = document.getElementById(`dose-input-${id}`);
                if (inputEl) {
                    if (p.dose > 20) inputEl.classList.add('high-dose');
                    else inputEl.classList.remove('high-dose');
                }
                calculateResult(); 
            }
        }

        function renderPrescription() {
            const list = document.getElementById('prescriptionList'); 
            list.innerHTML = '';
            prescription.forEach(p => {
                list.innerHTML += `
                    <div class="presc-item ${p.isWarning ? 'warning-bg' : ''}">
                        <div>
                            <span class="${p.isWarning?'warning-text':''}"><strong>${p.name}</strong></span><br>
                            <small style="color:#666;">(倍數:${p.ratio > 0 ? p.ratio : '⚠️ 缺資料'})</small>
                        </div>
                        <div>
                            <input type="number" id="dose-input-${p.id}" class="${p.dose > 20 ? 'high-dose':''}" 
                                   min="0" step="0.1" placeholder="克/日" 
                                   value="${p.dose > 0 ? p.dose : ''}" 
                                   onkeyup="updateDose(${p.id}, this.value)" 
                                   onchange="updateDose(${p.id}, this.value)"
                                   onwheel="this.blur()"> g
                            <button class="remove-btn" onclick="removePrescription(${p.id})">X</button>
                        </div>
                    </div>`;
            });
        }

        // 🌟【核心數學引擎】完美支援楚河漢界與防當機裝甲
        function calculateResult() {
            let finalHerbs = {}; 
            let totalExc = 0; 
            let grandRaw = 0;

            prescription.forEach(p => {
                if (p.dose > 0 && !p.isWarning && p.ratio > 0) {
                    
                    // 1. 算出製程實體重量 (浸膏實重 + 原粉實重 + 賦形劑實重)
                    // 防呆：加上 || 0.0001 避免遇到全空資料時除以零當機
                    let physicalConcExtract = p.concTotalWeight / (p.ratio || 1); 
                    let physicalRawPowder = p.rawTotalWeight; 
                    let formulaTotalWeight = physicalConcExtract + physicalRawPowder + p.excTotalWeight;
                    
                    if(formulaTotalWeight <= 0) formulaTotalWeight = 0.0001; 

                    // 2. 結算濃縮生藥 (需乘上倍數)
                    for (let herb in p.concHerbs) {
                        let portionInExtract = p.concHerbs[herb] / (p.concTotalWeight || 0.0001);
                        let actualWeightInFormula = portionInExtract * physicalConcExtract;
                        let rawEquivalent = p.dose * (actualWeightInFormula / formulaTotalWeight) * p.ratio;
                        
                        finalHerbs[herb] = (finalHerbs[herb] || 0) + rawEquivalent;
                        grandRaw += rawEquivalent;
                    }

                    // 3. 結算原粉生藥 (倍數恆定為 1)
                    for (let herb in p.rawHerbs) {
                        let actualWeightInFormula = p.rawHerbs[herb]; 
                        let rawEquivalent = p.dose * (actualWeightInFormula / formulaTotalWeight) * 1.0;
                        
                        finalHerbs[herb] = (finalHerbs[herb] || 0) + rawEquivalent;
                        grandRaw += rawEquivalent;
                    }

                    // 4. 結算賦形劑 (患者實際吃下肚的澱粉/纖維素重量)
                    let excDose = p.dose * (p.excTotalWeight / formulaTotalWeight);
                    totalExc += excDose;
                }
            });

            // 渲染結果並觸發毒劇藥警示
            const list = document.getElementById('resultList'); 
            list.innerHTML = '';
            Object.keys(finalHerbs).sort((a, b) => finalHerbs[b] - finalHerbs[a]).forEach(herb => {
                if(finalHerbs[herb] > 0.01){
                    let alertHtml = '';
                    if(toxicAlerts[herb] && finalHerbs[herb] > toxicAlerts[herb]) {
                        alertHtml = `<span class="toxic-alert">⚠️ 超出常規劑量上限(${toxicAlerts[herb]}g)，請謹慎評估</span>`;
                    }
                    list.innerHTML += `
                        <li class="result-item">
                            <div>${herb} ${alertHtml}</div> 
                            <span style="color:#2c3e50;">${finalHerbs[herb].toFixed(2)} g</span>
                        </li>`;
                }
            });
            
            document.getElementById('totalWeightDisplay').innerText = `總生藥重量: ${grandRaw.toFixed(2)} g`;
            document.getElementById('totalExcipientDisplay').innerText = `其中包含賦形劑: ${totalExc.toFixed(2)} g`;
        }

        // 網頁載入時自動啟動
        loadCloudDatabase();
    </script>
</body>
</html>
